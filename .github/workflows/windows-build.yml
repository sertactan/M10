name: Windows Production Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - phase12-production-build-final
      - main
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "config/**"
      - "specs/s153_v14/**"
      - "specs/s153_v141/**"
      - "main.py"
      - "pyproject.toml"
      - "packaging/windows/**"
      - "tests/**"
      - "scripts/**"
      - "PHASE12_STATUS.md"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
      WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release version alignment
        shell: pwsh
        run: |
          python scripts/check_release_version.py --root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install application and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "pyinstaller>=6.11"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build bundled SEC universe seed
        shell: pwsh
        run: |
          python scripts/build_sec_seed.py
          if (!(Test-Path "data/seeds/sec_us_current.csv")) {
            throw "Bundled SEC seed was not produced"
          }
          $rows = (Get-Content "data/seeds/sec_us_current.csv").Count - 1
          if ($rows -lt 1000) {
            throw "Bundled SEC seed is unexpectedly small: $rows"
          }

      - name: Build bundled JP TR HK reference seed
        shell: pwsh
        run: |
          python scripts/build_jp_tr_hk_seed.py
          $seed = "data/seeds/jp_tr_hk_current.csv"
          if (!(Test-Path $seed)) {
            throw "Bundled JP/TR/HK reference seed was not produced"
          }
          $rows = Import-Csv $seed
          $jp = @($rows | Where-Object { $_.market -eq "JP" }).Count
          $tr = @($rows | Where-Object { $_.market -eq "TR" }).Count
          $hk = @($rows | Where-Object { $_.market -eq "HK" }).Count
          Write-Host "JP=$jp TR=$tr HK=$hk"
          if ($jp -lt 3000) { throw "JP seed unexpectedly small: $jp" }
          if ($tr -lt 300) { throw "TR seed unexpectedly small: $tr" }
          if ($hk -lt 1500) { throw "HK seed unexpectedly small: $hk" }

      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean packaging/windows/S153ResearchTerminal.spec
          if (!(Test-Path "dist/S153ResearchTerminal/S153ResearchTerminal.exe")) {
            throw "PyInstaller executable was not produced"
          }

      - name: Prepare Authenticode signing
        shell: pwsh
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PASSWORD)
          ) {
            "SIGNING_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "SIGNING_STATUS=UNSIGNED_NO_CERTIFICATE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Authenticode signing certificate is not configured."
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP "m10-codesign.pfx"
          try {
            [System.IO.File]::WriteAllBytes(
              $pfx,
              [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64)
            )
          }
          catch {
            throw "WINDOWS_CODESIGN_PFX_BASE64 is not valid Base64."
          }
          "SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_STATUS=AUTHENTICODE_SIGNED" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign Windows application
        shell: pwsh
        run: |
          if ($env:SIGNING_ENABLED -ne "true") {
            Write-Host "Skipping application signing: certificate not configured."
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found" }
          $timestamp = $env:WINDOWS_CODESIGN_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestamp)) {
            $timestamp = "http://timestamp.digicert.com"
          }
          & $signtool.FullName sign /fd SHA256 /f $env:SIGNING_PFX_PATH /p $env:WINDOWS_CODESIGN_PASSWORD /tr $timestamp /td SHA256 "dist\S153ResearchTerminal\S153ResearchTerminal.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool.FullName verify /pa /v "dist\S153ResearchTerminal\S153ResearchTerminal.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged V1.4.1 canonical completion spec
        shell: pwsh
        run: |
          $spec = "dist\S153ResearchTerminal\_internal\specs\s153_v141\canonical_completion_specification.md"
          if (!(Test-Path $spec)) {
            throw "Packaged V1.4.1 canonical completion spec is missing: $spec"
          }

      - name: Verify packaged schema
        shell: pwsh
        run: |
          $schema = "dist\S153ResearchTerminal\_internal\data\database\schema.sql"
          if (!(Test-Path $schema)) {
            throw "Packaged SQLite schema is missing: $schema"
          }

      - name: Verify packaged SEC universe seed
        shell: pwsh
        run: |
          $seed = "dist\S153ResearchTerminal\_internal\data\seeds\sec_us_current.csv"
          if (!(Test-Path $seed)) {
            throw "Packaged SEC universe seed is missing: $seed"
          }

      - name: Verify packaged JP TR HK reference seed
        shell: pwsh
        run: |
          $seed = "dist\S153ResearchTerminal\_internal\data\seeds\jp_tr_hk_current.csv"
          if (!(Test-Path $seed)) {
            throw "Packaged JP/TR/HK reference seed is missing: $seed"
          }
          $rows = Import-Csv $seed
          $jp = @($rows | Where-Object { $_.market -eq "JP" }).Count
          $tr = @($rows | Where-Object { $_.market -eq "TR" }).Count
          $hk = @($rows | Where-Object { $_.market -eq "HK" }).Count
          if ($jp -lt 3000 -or $tr -lt 300 -or $hk -lt 1500) {
            throw "Packaged JP/TR/HK seed failed row-count validation"
          }

      - name: Clean-install offline first-run smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\S153ResearchTerminal\S153ResearchTerminal.exe").Path
          $smoke = Join-Path $env:RUNNER_TEMP "s153-clean-install"
          $runtime = Join-Path $smoke "runtime"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $smoke
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          $env:S153_RUNTIME_ROOT = $runtime
          Push-Location $smoke
          try {
            $doctor = Start-Process -FilePath $exe -ArgumentList "--doctor" -Wait -PassThru
            if ($doctor.ExitCode -ne 0) { exit $doctor.ExitCode }
          }
          finally {
            Pop-Location
          }

          $db = Join-Path $runtime "data\runtime\operational.db"
          if (!(Test-Path $db)) {
            throw "Fresh install did not create operational.db"
          }
          $verifyFresh = @'
          import sqlite3
          import sys

          conn = sqlite3.connect(sys.argv[1])
          rows = conn.execute(
              "select count(*) from security_master where market='US'"
          ).fetchone()[0]
          conn.close()
          print("Fresh US rows=", rows)
          assert rows >= 1000
          '@
          $verifyFresh | python - $db
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Corrupt database recovery smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\S153ResearchTerminal\S153ResearchTerminal.exe").Path
          $runtime = Join-Path $env:RUNNER_TEMP "s153-clean-install\runtime"
          $env:S153_RUNTIME_ROOT = $runtime
          $db = Join-Path $runtime "data\runtime\operational.db"
          [System.IO.File]::WriteAllBytes(
            $db,
            [System.Text.Encoding]::UTF8.GetBytes("not a sqlite database")
          )

          $doctor = Start-Process -FilePath $exe -ArgumentList "--doctor" -Wait -PassThru
          if ($doctor.ExitCode -ne 0) { exit $doctor.ExitCode }

          $backups = @(Get-ChildItem -Path (Split-Path $db) -Filter "operational.db.corrupt-*.bak")
          if ($backups.Count -lt 1) {
            throw "Corrupt SQLite database was not preserved as a backup"
          }
          $verifyRecovery = @'
          import sqlite3
          import sys

          conn = sqlite3.connect(sys.argv[1])
          rows = conn.execute(
              "select count(*) from security_master where market='US'"
          ).fetchone()[0]
          quick_check = conn.execute("pragma quick_check").fetchone()[0]
          conn.close()
          print("Recovered US rows=", rows, "quick_check=", quick_check)
          assert rows >= 1000
          assert quick_check == "ok"
          '@
          $verifyRecovery | python - $db
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upgrade migration smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\S153ResearchTerminal\S153ResearchTerminal.exe").Path
          $runtime = Join-Path $env:RUNNER_TEMP "s153-upgrade-runtime"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $runtime
          $dbDir = Join-Path $runtime "data\runtime"
          New-Item -ItemType Directory -Force -Path $dbDir | Out-Null
          $db = Join-Path $dbDir "operational.db"

          $createLegacy = @'
          import sqlite3
          import sys

          db = sys.argv[1]
          conn = sqlite3.connect(db)
          conn.executescript("""
          CREATE TABLE security_master (
              security_id TEXT PRIMARY KEY,
              ticker TEXT NOT NULL,
              name TEXT NOT NULL,
              exchange TEXT NOT NULL,
              market TEXT NOT NULL DEFAULT 'US',
              cik TEXT,
              sector TEXT,
              industry TEXT,
              ipo_date TEXT,
              delisted_date TEXT,
              active INTEGER NOT NULL DEFAULT 1,
              created_at TEXT NOT NULL,
              updated_at TEXT NOT NULL
          );
          CREATE TABLE ticker_aliases (
              alias TEXT NOT NULL,
              security_id TEXT NOT NULL,
              valid_from TEXT NOT NULL DEFAULT '',
              valid_to TEXT,
              PRIMARY KEY(alias, security_id, valid_from)
          );
          INSERT INTO security_master (
              security_id,ticker,name,exchange,market,active,created_at,updated_at
          ) VALUES (
              'LEGACY-1','OLD','Legacy Corp','NASDAQ','US',1,
              '2025-01-01T00:00:00+00:00','2025-01-01T00:00:00+00:00'
          );
          """)
          conn.commit()
          conn.close()
          '@
          $createLegacy | python - $db
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:S153_RUNTIME_ROOT = $runtime
          $doctor = Start-Process -FilePath $exe -ArgumentList "--doctor" -Wait -PassThru
          if ($doctor.ExitCode -ne 0) { exit $doctor.ExitCode }

          $verifyUpgrade = @'
          import sqlite3
          import sys

          conn = sqlite3.connect(sys.argv[1])
          cols = {row[1] for row in conn.execute("pragma table_info(security_master)")}
          aliases = {row[1] for row in conn.execute("pragma table_info(ticker_aliases)")}
          legacy = conn.execute(
              "select ticker from security_master where security_id='LEGACY-1'"
          ).fetchone()
          us_rows = conn.execute(
              "select count(*) from security_master where market='US'"
          ).fetchone()[0]
          conn.close()

          print("Upgraded US rows=", us_rows)
          assert {
              "country_code",
              "listing_key",
              "source_scope",
              "source_priority",
              "first_seen",
              "last_seen",
          } <= cols
          assert {
              "source",
              "event_type",
              "availability_date",
              "ingested_at",
          } <= aliases
          assert legacy and legacy[0] == "OLD"
          assert us_rows >= 1000
          '@
          $verifyUpgrade | python - $db
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging\windows\S153ResearchTerminal.iss"
          if (!(Test-Path "dist_installer/S153ResearchTerminal-Setup.exe")) {
            throw "Installer was not produced"
          }

      - name: Sign Windows installer
        shell: pwsh
        run: |
          if ($env:SIGNING_ENABLED -eq "true") {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe was not found" }
            $timestamp = $env:WINDOWS_CODESIGN_TIMESTAMP_URL
            if ([string]::IsNullOrWhiteSpace($timestamp)) {
              $timestamp = "http://timestamp.digicert.com"
            }
            & $signtool.FullName sign /fd SHA256 /f $env:SIGNING_PFX_PATH /p $env:WINDOWS_CODESIGN_PASSWORD /tr $timestamp /td SHA256 "dist_installer\S153ResearchTerminal-Setup.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa /v "dist_installer\S153ResearchTerminal-Setup.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Set-Content -Path "dist_installer\SIGNING_STATUS.txt" -Value $env:SIGNING_STATUS -Encoding utf8

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash "dist_installer/S153ResearchTerminal-Setup.exe" -Algorithm SHA256 |
            Format-List | Out-File "dist_installer/SHA256.txt"

      - name: WF8-E final release gate
        shell: pwsh
        run: |
          python scripts/check_wf8e_release_gate.py `
            --root "." `
            --packaged-root "dist/S153ResearchTerminal/_internal" `
            --installer "dist_installer/S153ResearchTerminal-Setup.exe" `
            --sha-file "dist_installer/SHA256.txt" `
            --commit "${{ github.sha }}" `
            --output "dist_installer/WF8E_RELEASE_EVIDENCE.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: S153ResearchTerminal-Windows
          path: |
            dist_installer/S153ResearchTerminal-Setup.exe
            dist_installer/SHA256.txt
            dist_installer/WF8E_RELEASE_EVIDENCE.json
            dist_installer/SIGNING_STATUS.txt

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $version = (Get-Content "config/RELEASE_VERSION.txt" -Raw).Trim()
          if (-not $version) { throw "config/RELEASE_VERSION.txt is empty" }
          $tag = "v$version"
          $setup = "dist_installer/S153ResearchTerminal-Setup.exe"
          $sha = "dist_installer/SHA256.txt"
          $wf8e = "dist_installer/WF8E_RELEASE_EVIDENCE.json"
          $signing = "dist_installer/SIGNING_STATUS.txt"
          $signingStatus = (Get-Content $signing -Raw).Trim()
          if ($signingStatus -ne "AUTHENTICODE_SIGNED") {
            throw "Production GitHub Release requires Authenticode signing. Status: $signingStatus"
          }
          $title = "S15.3 Research Terminal v$version"
          $notes = @"
          S15.3 Research Terminal v$version.

          Includes:
          - S15.3 V1.4.1 production scoring
          - WF1-WF8 free/PIT walk-forward data and validation chain
          - WF7 OOS empirical magnitude calibration
          - WF8 production hardening, reproducibility manifest, tamper detection and rollback-safe activation
          - one-command production evidence orchestrator
          - Windows clean-install, corrupt-DB recovery and upgrade-migration smoke tests
          - WF8-E final runtime/release evidence
          - S16 V1.0 desktop surface
          - S16-EA V1.3 canonical Hybrid FastPath engine + fail-closed desktop surface
          - Authenticode signing evidence
          - installer SHA-256
          "@

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup $sha $wf8e $signing --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --target "${{ github.sha }}" --title $title --notes $notes --latest --repo $repo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            gh release create $tag $setup $sha $wf8e $signing --target "${{ github.sha }}" --title $title --notes $notes --latest --repo $repo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
