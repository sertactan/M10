name: Windows Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - phase12-production-build
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "config/**"
      - "main.py"
      - "pyproject.toml"
      - "packaging/windows/**"
      - "tests/**"
      - "PHASE12_STATUS.md"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "pyinstaller>=6.11"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean packaging/windows/S153ResearchTerminal.spec
          if (!(Test-Path "dist/S153ResearchTerminal/S153ResearchTerminal.exe")) {
            throw "PyInstaller executable was not produced"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging\windows\S153ResearchTerminal.iss"
          if (!(Test-Path "dist_installer/S153ResearchTerminal-Setup.exe")) {
            throw "Installer was not produced"
          }

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash "dist_installer/S153ResearchTerminal-Setup.exe" -Algorithm SHA256 |
            Format-List | Out-File "dist_installer/SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: S153ResearchTerminal-Windows
          path: |
            dist_installer/S153ResearchTerminal-Setup.exe
            dist_installer/SHA256.txt
