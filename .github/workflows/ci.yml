name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pandas pydantic PyYAML httpx pyarrow duckdb PySide6

      - name: Compile
        run: python -m compileall -q app core data main.py

      - name: Test
        run: python -m pytest -q
