name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install test/runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pandas pydantic PyYAML httpx pyarrow duckdb PySide6

      - name: Compile
        run: python -m compileall -q app core data scripts/hermes_team_tasks.py scripts/hermes_team_mcp.py scripts/hermes_team_no_agent_tick.py main.py

      - name: Hermes strict-free controls and API contracts
        env:
          OPENAI_PAID_API_ENABLED: "false"
          PAID_LLM_FALLBACK_ENABLED: "false"
          LIVE_TRADING_ENABLED: "false"
          MERIDYEN_TELEGRAM_SEND_ENABLED: "false"
        run: python -m pytest -q tests/test_hermes_*.py

      - name: Test
        run: python -m pytest -q
