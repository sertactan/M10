universe:
  primary: SEC_EDGAR
  passive_cache: BUNDLED_SEC_SNAPSHOT
  historical_pit_primary_free: ALPHAVANTAGE_PIT
  historical_pit_accelerator: MASSIVE
  validation_fallback: FINNHUB
  optional_fallback: FMP
  exchanges: [XNAS, XNYS, XASE]
  security_types: [CS]
  include_delisted_default: true
  historical_requires_massive: false
  historical_requires_pit_source: true

prices:
  optional_accelerators:
    - MASSIVE
  provider_priority:
    - MARKETPARQUET
    - STOOQ
    - SIMFIN
    - YAHOO_COMPAT
  forbid_cross_provider_stitching: true
  yahoo_authoritative: false
  require_adjusted_for_backtest: true
  parquet_root: "data/runtime/parquet"

fundamentals:
  regulatory_priority:
    - SEC_EDGAR
    - FINNHUB
    - SIMFIN
    - FMP
  authoritative_regulatory_source: SEC_EDGAR
  analyst_estimates_source: FINNHUB
  company_guidance_precedence:
    - SEC_EDGAR
    - COMPANY_IR
    - FINNHUB
    - FMP
  secondary_may_overwrite_sec: false
  accepted_timestamp_required_for_exact_intraday_pit: true
  conservative_missing_acceptance: true

sec_edgar:
  enabled: true
  base_url: "https://www.sec.gov"
  data_base_url: "https://data.sec.gov"
  ticker_exchange_path: "/files/company_tickers_exchange.json"
  user_agent_env: "SEC_USER_AGENT"
  max_requests_per_second: 8
  timeout_seconds: 30
  max_retries: 3

alpha_vantage:
  enabled: true
  base_url: "https://www.alphavantage.co/query"
  api_key_env: "ALPHAVANTAGE_API_KEY"
  role: "free_historical_pit_universe"

massive:
  enabled: true
  base_url: "https://api.massive.com"
  api_key_env: "MASSIVE_API_KEY"
  timeout_seconds: 30
  max_retries: 4

stooq:
  enabled: true
  base_url: "https://stooq.com/q/d/l/"
  bulk_zip_path_env: "STOOQ_BULK_ZIP_PATH"
  role: "bootstrap"

simfin:
  enabled: true
  bulk_price_path_env: "SIMFIN_PRICE_BULK_PATH"
  bulk_fundamentals_path_env: "SIMFIN_FUNDAMENTALS_PATH"
  role: "secondary_bootstrap"

yahoo_compatible:
  enabled: true
  base_url: "https://query1.finance.yahoo.com/v8/finance/chart"
  role: "fallback_validation_only"
  authoritative: false

marketparquet:
  enabled: true
  root_env: "MARKETPARQUET_ROOT"
  role: "optional_survivorship_aware_bulk"

finnhub:
  enabled: true
  base_url: "https://finnhub.io/api/v1"
  api_key_env: "FINNHUB_API_KEY"
  timeout_seconds: 30
  max_retries: 3

fmp:
  enabled: true
  base_url: "https://financialmodelingprep.com/stable"
  api_key_env: "FMP_API_KEY"
  role: "fallback_validation"

async_racing:
  enabled: true
  default_provider_concurrency: 2
  provider_concurrency_limits:
    SEC_EDGAR: 1
    ALPHAVANTAGE_PIT: 1
    MASSIVE: 2
    STOOQ: 2
    SIMFIN: 2
    YAHOO_COMPAT: 2
    MARKETPARQUET: 4
    FINNHUB: 2
    FMP: 2
  preserve_canonical_priority: true
  cancel_losers_after_winner: true
